# Workspace-level Cargo configuration.
#
# ARM / firmware-specific settings (default target, linker flags, probe-rs
# runner) live in firmware/.cargo/config.toml and only apply when building
# from within the firmware/ directory.
#
# To build the firmware binary, use:
#   cd firmware && cargo build --release
#
# To build the bridge server (native Linux):
#   cargo build -p etag-bridge --release

[env]
# Set the defmt log level.  Override at the command line with:
#   DEFMT_LOG=info cargo run
DEFMT_LOG = "debug"
