# ── Cargo Workspace ──────────────────────────────────────────────────────────
#
# Members:
#   firmware/     — nRF52840 embedded firmware (cross-compiled for ARM Cortex-M4)
#   etag-bridge/  — Raspberry Pi BLE ↔ Grocy bridge server (native Linux)
#
# Building firmware:
#   cd firmware && cargo build --release
#   # or from workspace root with explicit target:
#   cargo build -p etag --target thumbv7em-none-eabihf --release
#
# Building the bridge:
#   cargo build -p etag-bridge --release
#
[workspace]
members = [
    "firmware",
    "etag-bridge",
]
resolver = "2"

# ── Build profiles (workspace-wide) ─────────────────────────────────────────
[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = "fat"
opt-level        = "s"
overflow-checks  = false

[profile.dev]
codegen-units    = 1
debug            = 2
debug-assertions = true
incremental      = false
opt-level        = 1
overflow-checks  = true
