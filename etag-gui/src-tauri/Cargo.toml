[package]
name = "etag-gui"
version = "0.1.0"
edition = "2021"
description = "etag GUI — desktop interface for managing etag nodes via the etag-bridge gRPC API"
license = "MIT"
authors = []

# Tauri v2 requires all three crate types for cross-platform (desktop + mobile) builds.
[lib]
name = "etag_gui_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "etag-gui"
path = "src/main.rs"

# ── Build dependencies ────────────────────────────────────────────────────────

[build-dependencies]
# Tauri build-time metadata injection.
tauri-build = { version = "2", features = [] }
# gRPC code generation from proto/etag_bridge.proto.
tonic-build         = "0.14"
protoc-bin-vendored = "3"

# ── Runtime dependencies ──────────────────────────────────────────────────────

[dependencies]
# Tauri desktop framework.
tauri = { version = "2", features = [] }

# gRPC client — connects to the etag-bridge server.
tonic = { version = "0.14", features = ["transport"] }
prost = "0.14"

# Async runtime (Tauri's internal runtime; tokio is needed for tonic).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

# Serde for Tauri command return types (JSON-serializable DTOs).
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling.
anyhow = "1"

# ── Features ─────────────────────────────────────────────────────────────────

[features]
# Used by Tauri to serve bundled frontend assets via the custom tauri:// protocol.
# DO NOT REMOVE — required for production builds.
custom-protocol = ["tauri/custom-protocol"]
